<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4f71">
<link rel="manifest" href="manifest.webmanifest">
<title>TECHNIQUE VDP</title>
<style>
:root{--blue:#0b4f71;--blue2:#eaf5fa;--bg:#f5f7f9;--text:#17212b;--ok:#197a4b;--warn:#a55b00;--muted:#66727d;--card:#fff;--border:#d9e0e5}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--blue);color:white;padding:14px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0002}
.header-row{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:21px;margin:0}.user{font-size:12px;opacity:.9;text-align:right}
nav{background:white;border-bottom:1px solid var(--border);position:sticky;top:58px;z-index:9}
.navin{max-width:1100px;margin:auto;display:flex;overflow:auto}
nav button{border:0;background:white;padding:12px 14px;font-weight:700;color:var(--muted);white-space:nowrap}
nav button.active{color:var(--blue);border-bottom:3px solid var(--blue)}
main{max-width:1100px;margin:18px auto;padding:0 14px 40px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #0000000a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
button,.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
button.secondary,.btn.secondary{background:#eef2f5;color:var(--text)}button.danger{background:#a52828}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:9px;font:inherit;background:white}
label{display:block;font-weight:700;font-size:13px;margin:9px 0 5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}
.hidden{display:none!important}.boat{display:flex;justify-content:space-between;gap:12px;align-items:center}
.boat h3{margin:0 0 5px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:800;background:#edf2f5}
.pill.ok{background:#e3f4eb;color:var(--ok)}.pill.warn{background:#fff0df;color:var(--warn)}
.item{border:1px solid var(--border);border-radius:12px;padding:13px;margin:9px 0}.item-title{font-weight:700}
.choices{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.choices button{background:#eef2f5;color:var(--text)}.choices button.sel-ok{background:#dff3e8;color:var(--ok)}.choices button.sel-anom{background:#ffe9d2;color:var(--warn)}.choices button.sel-na{background:#e8edf0;color:#59646c}
.anomaly{margin-top:10px}.photos{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.photos img{width:90px;height:70px;object-fit:cover;border-radius:8px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}.dow{font-size:11px;font-weight:800;color:var(--muted);text-align:center;padding:5px}.day{min-height:82px;background:white;border:1px solid var(--border);border-radius:8px;padding:7px;cursor:pointer}.day.other{opacity:.4}.day.sel{outline:3px solid #7bb5d0}.num{font-weight:800}.task-dot{font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-done{text-decoration:line-through;opacity:.6}.task{border-left:5px solid var(--blue);padding:10px 12px;background:white;border:1px solid var(--border);border-radius:10px;margin:8px 0}.task.done{border-left-color:var(--ok)}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;font-size:13px}
.notice{padding:11px;border-radius:10px;background:#eef7fb;border:1px solid #cce3ed;margin:10px 0}.levelbox{background:#f8fbfc;border:1px solid #cfe0e7;border-radius:10px;padding:10px;margin-top:10px}.levelgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.error{background:#fff0f0;border-color:#f1caca;color:#8c2222}
.login{max-width:430px;margin:50px auto}.right{text-align:right}
@media(max-width:600px){main{padding:0 9px 30px}.day{min-height:65px;padding:5px}.task-dot{font-size:9px}.boat{align-items:flex-start;flex-direction:column}.choices button{flex:1}}
</style>
</head>
<body>
<header><div class="header-row"><h1>⚓ TECHNIQUE VDP</h1><div class="user" id="userBox"></div></div></header>
<div id="loginView" class="login">
  <div class="card">
    <h2>Connexion</h2>
    <p class="small">Connectez-vous pour accéder au planning et aux check-lists.</p>
    <label>Email</label><input id="loginEmail" type="email" autocomplete="username">
    <label>Mot de passe</label><input id="loginPassword" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:12px"><button id="loginBtn">Se connecter</button></div>
    <div id="loginMsg" class="small"></div>
  </div>
</div>
<div id="appView" class="hidden">
<nav><div class="navin">
<button data-page="home" class="active">⚓ Bateaux</button>
<button data-page="calendar">📅 Planning</button>
<button data-page="levels">🛢️ Suivi niveaux</button>
<button data-page="temperatures">🌡️ Températures ligne d’arbre</button>
<button data-page="inventory">🧰 Inventaire</button>
<button data-page="history">📋 Checklists enregistrées</button>
<button data-page="audits">🔎 Audit bateaux</button>
<button data-page="admin" id="adminNav" class="hidden">⚙️ Administration</button>
<button id="logoutBtn" class="secondary">Déconnexion</button>
</div></nav>
<main>
<section id="page-home"></section>
<section id="page-calendar" class="hidden"></section>
<section id="page-levels" class="hidden"></section>
<section id="page-temperatures" class="hidden"></section>
<section id="page-inventory" class="hidden"></section>
<section id="page-history" class="hidden"></section>
<section id="page-audits" class="hidden"></section>
<section id="page-admin" class="hidden"></section>
<section id="page-checklist" class="hidden"></section>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const {createClient}=supabase;
const client=createClient(VDP_CONFIG.supabaseUrl,VDP_CONFIG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const BOATS=["Paris Iéna","Paris Trocadéro","Paris Montmartre","Paris Montparnasse","Paris Etoile","Vedettes de Paris","Gustave","Batobar","Quai","Billetterie","Boutique","Café des Vedettes","Ponton Alex","Marinella","Vernazza","Entrepôt 15ème"];
const STANDARD=[
"Vérification de l'ensemble des locaux (fuite, eau dans les fonds, bruits anormaux,...)",
"Vérification niveau liquide de refroidissement moteurs",
"Vérification niveau huile appareil à gouverner",
"Vérification niveau huile étambot lignes d'arbres",
"Démarrage pack batteries Bâbord et Tribord",
"Essais appareil à gouverner normal et secours",
"Démarrage moteurs + test Embrayage Av/Ar",
"Vérification fonctionnement pompes de réfrigération moteur quand les moteurs sont en service",
"Essais : Feux de navigation, GPS, VHF, Interphonie, Propulseur d'étrave, Micro/Sono, commande de l'appareil à gouverner normal et secours",
"Vérification AIS",
"Essai bascule distribution électrique AFE",
"Créer nouvelle croisière sur l'onglet journal de bord de BoatOn"
];
const ETOILE=[
"Vérification de l'ensemble des locaux",
"Vérification niveau liquide de refroidissement ligne d'arbre",
"Vérification niveau huile appareil à gouverner",
"Nettoyage des filtres eau brut",
"Vérification niveau huile + liquide de refroidissement GENSET 1 et 2",
"Vérification tension batteries",
"Démarrage GENSET 1 et 2",
"Démarrage moteurs + test Embrayage Av/Ar",
"Vérification pression huile GENSET 1 et 2",
"Vérification circulation eaux de réfrigération échappement",
"Essais : Feux de navigation, GPS, VHF, Interphonie, Propulseur d'étrave, Micro/Sono, commande de l'appareil à gouverner normal et secours",
"Vérification AIS",
"Vérification ventilateurs variateur moteur",
"Alimentations 24 V"
];
let profile=null,boats=[],items=[],tasks=[],levelRecords=[],temperatureRecords=[],inventoryCatalog=[],inventoryRecords=[],filterInventoryCatalog=[],filterInventoryRecords=[],inventoryMode="oil",checklistSubmissions=[],auditRecords=[];
let checklistGeneralComment="";
let currentBoat=null,currentItems=[],answers={},photos={},checklistTechName="",checklistDate="";
let calDate=new Date(); let selectedDate=isoDate(new Date());

function isoDate(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fmt(d){return new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function showPage(p){document.querySelectorAll("main>section").forEach(x=>x.classList.add("hidden"));document.getElementById("page-"+p).classList.remove("hidden");document.querySelectorAll("nav button[data-page]").forEach(x=>x.classList.toggle("active",x.dataset.page===p))}
function setMsg(id,msg,error=false){let e=document.getElementById(id);if(e){e.textContent=msg;e.className="small"+(error?" error":"")}}
async function loadProfile(){
 const {data:{user}}=await client.auth.getUser(); if(!user){profile=null;return}
 const {data,error}=await client.from("profiles").select("*").eq("id",user.id).single();
 if(error){console.error(error);profile={id:user.id,email:user.email,role:"operator"}} else profile=data;
 document.getElementById("userBox").innerHTML=esc(user.email)+"<br><b>"+esc(profile.role==="admin"?"Administrateur":"Opérateur")+"</b>";
 document.getElementById("adminNav").classList.toggle("hidden",profile.role!=="admin");
}
async function loadData(){
 let r=await client.from("boats").select("*").order("sort_order"); if(r.error)throw r.error; boats=r.data||[];
 r=await client.from("checklist_items").select("*").eq("active",true).order("boat_id").order("position"); if(r.error)throw r.error; items=r.data||[];
 r=await client.from("tasks").select("*").order("task_date").order("created_at"); if(r.error)throw r.error; tasks=r.data||[];
 r=await client.from("level_records").select("*").order("created_at",{ascending:false}); if(r.error)throw r.error; levelRecords=r.data||[];
 r=await client.from("temperature_records").select("*").order("created_at",{ascending:false}); if(r.error){console.warn("Suivi des températures indisponible :",r.error.message);temperatureRecords=[];} else temperatureRecords=r.data||[];
 r=await client.from("oil_grease_catalog").select("*").order("boat_name").order("position"); if(r.error){console.warn("Catalogue huile & graisse indisponible :",r.error.message);inventoryCatalog=[];} else inventoryCatalog=r.data||[];
 r=await client.from("oil_grease_inventory_records").select("*").order("inventory_date",{ascending:false}).order("created_at",{ascending:false}); if(r.error){console.warn("Inventaire huile & graisse indisponible :",r.error.message);inventoryRecords=[];} else inventoryRecords=r.data||[];
 r=await client.from("oil_filter_ge_catalog").select("*").order("position"); if(r.error){console.warn("Catalogue filtres GE Etoile indisponible :",r.error.message);filterInventoryCatalog=[];} else filterInventoryCatalog=r.data||[];
 r=await client.from("oil_filter_ge_inventory_records").select("*").order("inventory_date",{ascending:false}).order("created_at",{ascending:false}); if(r.error){console.warn("Inventaire filtres GE Etoile indisponible :",r.error.message);filterInventoryRecords=[];} else filterInventoryRecords=r.data||[];
 r=await client.from("checklist_submissions").select("*").order("checklist_date",{ascending:false}).order("created_at",{ascending:false}); if(r.error){console.warn("Historique des checklists indisponible :",r.error.message);checklistSubmissions=[];} else checklistSubmissions=r.data||[];
 r=await client.from("boat_audits").select("*").order("audit_date",{ascending:false}).order("created_at",{ascending:false}); if(r.error){console.warn("Audit bateaux indisponible :",r.error.message);auditRecords=[];} else auditRecords=r.data||[];
}
function renderHome(){
 const html=`<div class="card"><div class="row"><div class="grow"><h2 style="margin:0">Les 5 bateaux</h2><p class="muted">Technique disponible. Matin et Soir : à venir.</p></div><button onclick="showPage('history');renderChecklistHistory()">📋 Voir les checklists enregistrées</button></div></div><div class="grid">`+
 boats.map(b=>`<div class="card boat"><div><h3>⚓ ${esc(b.name)}</h3><span class="pill">🔧 Technique</span><span class="pill">☀️ Matin — à venir</span><span class="pill">🌙 Soir — à venir</span></div><button onclick="openChecklist('${b.id}')">Ouvrir</button></div>`).join("")+"</div>";
 document.getElementById("page-home").innerHTML=html;
}
function renderCalendar(){
 const y=calDate.getFullYear(),m=calDate.getMonth();
 const first=new Date(y,m,1), start=new Date(y,m,1-first.getDay()+1); // Monday
 const monthName=calDate.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
 let cells="",d=new Date(start);
 for(let i=0;i<42;i++){let ds=isoDate(d), ts=tasks.filter(t=>t.task_date===ds);cells+=`<div class="day ${d.getMonth()!==m?"other":""} ${ds===selectedDate?"sel":""}" onclick="selectDay('${ds}')"><div class="num">${d.getDate()}</div>${ts.slice(0,3).map(t=>`<div class="task-dot ${t.status==="done"?"task-done":""}">${t.status==="done"?"✓":"•"} ${esc(t.boat_name||"")}</div>`).join("")}${ts.length>3?`<div class="small">+${ts.length-3}</div>`:""}</div>`;d.setDate(d.getDate()+1)}
 document.getElementById("page-calendar").innerHTML=`<div class="card"><div class="calendar-head"><button class="secondary" onclick="moveMonth(-1)">‹</button><h2 style="margin:0;text-transform:capitalize">${monthName}</h2><button class="secondary" onclick="moveMonth(1)">›</button></div><div class="cal">${["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].map(x=>`<div class="dow">${x}</div>`).join("")}${cells}</div></div><div class="card" id="dayPanel"></div>`;
 renderDayPanel();
}
function renderDayPanel(){
 const ts=tasks.filter(t=>t.task_date===selectedDate);
 document.getElementById("dayPanel").innerHTML=`<div class="row"><div class="grow"><h2 style="margin:0;text-transform:capitalize">${fmt(selectedDate)}</h2><div class="small">${ts.length} tâche(s)</div></div><button onclick="showAddTaskForm()">＋ Ajouter une tâche</button></div>`+
 (ts.length?ts.map(t=>`<div class="task ${t.status==="done"?"done":""}"><div class="row"><div class="grow"><b>${esc(t.task)}</b><div class="small">⚓ ${esc(t.boat_name)} · 👤 ${esc(t.operator_name||"Non renseigné")}</div>${Array.isArray(t.photo_urls)&&t.photo_urls.length?`<div class="small" style="margin-top:6px">📷 ${t.photo_urls.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">Voir la photo ${i+1}</a>`).join(" · ")}</div>`:""}</div><span class="pill ${t.status==="done"?"ok":"warn"}">${t.status==="done"?"✓ Réalisée":"À faire"}</span></div><div class="row" style="margin-top:8px"><button class="secondary" onclick="showEditTaskForm('${t.id}')">✎ Modifier</button>${t.status!=="done"?`<button onclick="completeTask('${t.id}')">✓ Marquer réalisée</button>`:""}<button class="danger" onclick="deleteTask('${t.id}')">Supprimer</button></div></div>`).join(""):`<p class="muted">Aucune tâche pour cette journée.</p>`);
}
function selectDay(ds){selectedDate=ds;renderCalendar()}
function moveMonth(n){calDate.setMonth(calDate.getMonth()+n);renderCalendar()}
function showAddTaskForm(){
 const panel=document.getElementById("dayPanel");
 const existing=document.getElementById("addTaskForm");
 if(existing){existing.remove();return}
 const form=document.createElement("div");
 form.id="addTaskForm";
 form.className="card";
 form.innerHTML=`<h3 style="margin-top:0">＋ Nouvelle tâche</h3>
 <div class="grid">
  <div><label>Date</label><input id="newTaskDate" type="date" value="${esc(selectedDate)}"></div>
  <div><label>Bateau / lieu</label><select id="newTaskBoat">${BOATS.map(b=>`<option>${esc(b)}</option>`).join("")}</select></div>
  <div><label>Opérateur <span class="muted">(facultatif)</span></label><input id="newTaskOperator" placeholder="Nom de l'opérateur"></div>
  <div style="grid-column:1/-1"><label>Tâche</label><textarea id="newTaskText" rows="3" placeholder="Décrire la tâche"></textarea></div>
  <div style="grid-column:1/-1"><label>Photo(s) de la tâche</label><input id="newTaskPhotos" type="file" accept="image/*" capture="environment" multiple><div class="small">Les photos seront stockées dans Supabase et les liens apparaîtront dans la tâche.</div></div>
 </div>
 <div class="row" style="margin-top:10px"><button onclick="saveNewTask()">Enregistrer</button><button class="secondary" onclick="document.getElementById('addTaskForm').remove()">Annuler</button></div>
 <div id="addTaskMsg" class="small" style="margin-top:8px"></div>`;
 panel.prepend(form);
}
function showEditTaskForm(id){
 const t=tasks.find(x=>x.id===id);
 if(!t)return;
 const existing=document.getElementById("editTaskForm");
 if(existing)existing.remove();
 const form=document.createElement("div");
 form.id="editTaskForm";
 form.className="card";
 const photos=Array.isArray(t.photo_urls)?t.photo_urls:[];
 form.innerHTML=`<h3 style="margin-top:0">✎ Modifier la tâche</h3>
 <div class="grid">
  <div><label>Date</label><input id="editTaskDate" type="date" value="${esc(t.task_date||"")}"></div>
  <div><label>Bateau / lieu</label><select id="editTaskBoat">${BOATS.map(b=>`<option ${b===t.boat_name?"selected":""}>${esc(b)}</option>`).join("")}</select></div>
  <div><label>Opérateur</label><input id="editTaskOperator" value="${esc(t.operator_name||"")}"></div>
  <div style="grid-column:1/-1"><label>Tâche</label><textarea id="editTaskText" rows="3">${esc(t.task||"")}</textarea></div>
  ${photos.length?`<div style="grid-column:1/-1"><label>Photos actuelles</label><div class="small">${photos.map((u,i)=>`<label style="display:block;margin:5px 0"><input type="checkbox" class="editTaskKeepPhoto" data-url="${esc(u)}" checked> <a href="${esc(u)}" target="_blank" rel="noopener">Voir la photo ${i+1}</a></label>`).join("")}</div></div>`:""}
  <div style="grid-column:1/-1"><label>Ajouter des photos</label><input id="editTaskPhotos" type="file" accept="image/*" capture="environment" multiple><div class="small">Les nouvelles photos seront ajoutées aux photos conservées.</div></div>
 </div>
 <div class="row" style="margin-top:10px"><button onclick="saveEditedTask('${t.id}')">Enregistrer les modifications</button><button class="secondary" onclick="document.getElementById('editTaskForm').remove()">Annuler</button></div>
 <div id="editTaskMsg" class="small" style="margin-top:8px"></div>`;
 document.getElementById("dayPanel").prepend(form);
}
async function saveEditedTask(id){
 const t=tasks.find(x=>x.id===id);
 if(!t)return;
 const date=document.getElementById("editTaskDate").value;
 const boat=document.getElementById("editTaskBoat").value;
 const operator=document.getElementById("editTaskOperator").value.trim();
 const task=document.getElementById("editTaskText").value.trim();
 const files=[...(document.getElementById("editTaskPhotos")?.files||[])];
 if(!date||!boat||!task){setMsg("editTaskMsg","La date, le lieu/bateau et la tâche sont obligatoires.",true);return}
 if(t.status==="done"&&!operator){setMsg("editTaskMsg","Une tâche réalisée doit obligatoirement avoir un nom d’opérateur.",true);return}
 const button=document.querySelector('#editTaskForm button:not(.secondary)');
 button?.setAttribute('disabled','disabled');
 setMsg("editTaskMsg","Enregistrement des modifications…");
 const kept=[...document.querySelectorAll('.editTaskKeepPhoto:checked')].map(x=>x.dataset.url).filter(Boolean);
 const urls=[...kept];
 for(let i=0;i<files.length;i++){
   const f=files[i];
   const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_");
   const path=`tasks/${date}/${id}/${Date.now()}_${i}_${safe}`;
   const up=await client.storage.from("task-photos").upload(path,f,{upsert:false,contentType:f.type||"image/jpeg"});
   if(up.error){setMsg("editTaskMsg","La tâche est conservée mais une nouvelle photo n'a pas pu être envoyée : "+up.error.message,true);continue}
   urls.push(client.storage.from("task-photos").getPublicUrl(path).data.publicUrl);
 }
 const patch={task_date:date,boat_name:boat,operator_name:operator||null,task,photo_urls:urls};
 const r=await client.from("tasks").update(patch).eq("id",id);
 if(r.error){setMsg("editTaskMsg","Impossible de modifier la tâche : "+r.error.message,true);button?.removeAttribute('disabled');return}
 selectedDate=date;
 document.getElementById("editTaskForm")?.remove();
 await refresh();
 renderCalendar();
 alert("✓ Tâche modifiée et replanifiée.");
}
async function saveNewTask(){
 const date=document.getElementById("newTaskDate").value;
 const boat=document.getElementById("newTaskBoat").value;
 const operator=document.getElementById("newTaskOperator").value.trim();
 const task=document.getElementById("newTaskText").value.trim();
 const files=[...(document.getElementById("newTaskPhotos")?.files||[])];
 if(!date||!boat||!task){setMsg("addTaskMsg","La date, le lieu/bateau et la tâche sont obligatoires.",true);return}
 const button=document.querySelector('#addTaskForm button:not(.secondary)');
 button?.setAttribute('disabled','disabled');
 setMsg("addTaskMsg","Enregistrement de la tâche…");
 const {data:created,error}=await client.from("tasks").insert({task_date:date,boat_name:boat,operator_name:operator||null,task,status:"todo",photo_urls:[]}).select("id").single();
 if(error){setMsg("addTaskMsg","Impossible d'ajouter la tâche : "+error.message,true);button?.removeAttribute('disabled');return}
 const urls=[];
 for(let i=0;i<files.length;i++){
   const f=files[i];
   const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_");
   const path=`tasks/${date}/${created.id}/${Date.now()}_${i}_${safe}`;
   const up=await client.storage.from("task-photos").upload(path,f,{upsert:false,contentType:f.type||"image/jpeg"});
   if(up.error){setMsg("addTaskMsg","La tâche est créée mais une photo n'a pas pu être envoyée : "+up.error.message,true);continue}
   urls.push(client.storage.from("task-photos").getPublicUrl(path).data.publicUrl);
 }
 if(urls.length){const ur=await client.from("tasks").update({photo_urls:urls}).eq("id",created.id);if(ur.error){setMsg("addTaskMsg","Tâche créée, mais impossible d'enregistrer les liens photos : "+ur.error.message,true);button?.removeAttribute('disabled');return}}
 selectedDate=date;
 await refresh();
 renderCalendar();
 alert("✓ Tâche ajoutée au planning.");
}

function levelSpec(boatName,title){
  const t=(title||"").toLowerCase();
  const standard=["Paris Iéna","Paris Trocadéro","Paris Montmartre","Paris Montparnasse"].includes(boatName);
  if(standard && t.includes("huile") && t.includes("appareil à gouverner"))
    return [{key:"gouvernail_huile",label:"Appareil à gouverner",fluid:"Huile",equipment:"Appareil à gouverner",side:""}];
  if(standard && t.includes("huile") && t.includes("étambot"))
    return [
      {key:"etambot_huile_bd",label:"Étambot ligne d’arbre Bâbord",fluid:"Huile",equipment:"Étambot ligne d’arbre",side:"Bâbord"},
      {key:"etambot_huile_td",label:"Étambot ligne d’arbre Tribord",fluid:"Huile",equipment:"Étambot ligne d’arbre",side:"Tribord"}
    ];
  if(standard && t.includes("liquide de refroidissement") && t.includes("moteur"))
    return [
      {key:"moteur_lrc_bd",label:"Moteur Bâbord",fluid:"Liquide de refroidissement",equipment:"Moteur",side:"Bâbord"},
      {key:"moteur_lrc_td",label:"Moteur Tribord",fluid:"Liquide de refroidissement",equipment:"Moteur",side:"Tribord"}
    ];
  if(boatName==="Paris Etoile" && t.includes("liquide de refroidissement") && t.includes("ligne d'arbre"))
    return [
      {key:"ligne_arbre_lrc_bd",label:"Ligne d’arbre Bâbord",fluid:"Liquide de refroidissement",equipment:"Ligne d’arbre",side:"Bâbord"},
      {key:"ligne_arbre_lrc_td",label:"Ligne d’arbre Tribord",fluid:"Liquide de refroidissement",equipment:"Ligne d’arbre",side:"Tribord"}
    ];
  if(boatName==="Paris Etoile" && t.includes("huile") && t.includes("appareil à gouverner"))
    return [{key:"gouvernail_huile",label:"Appareil à gouverner",fluid:"Huile",equipment:"Appareil à gouverner",side:""}];
  if(boatName==="Paris Etoile" && t.includes("genset")){
    const out=[];
    if(t.includes("huile")){
      out.push({key:"genset1_huile",label:"GENSET 1 — Huile",fluid:"Huile",equipment:"GENSET",side:"1"});
      out.push({key:"genset2_huile",label:"GENSET 2 — Huile",fluid:"Huile",equipment:"GENSET",side:"2"});
    }
    if(t.includes("liquide de refroidissement")){
      out.push({key:"genset1_lrc",label:"GENSET 1 — Liquide de refroidissement",fluid:"Liquide de refroidissement",equipment:"GENSET",side:"1"});
      out.push({key:"genset2_lrc",label:"GENSET 2 — Liquide de refroidissement",fluid:"Liquide de refroidissement",equipment:"GENSET",side:"2"});
    }
    return out;
  }
  return [];
}

function renderInventoryForm(){
 const boat=document.getElementById("inventoryBoat")?.value||"",wrap=document.getElementById("inventoryFormRows");if(!wrap)return;
 if(!boat){wrap.innerHTML='<p class="muted">Choisissez un bateau pour afficher les références.</p>';return}
 if(inventoryMode==="filters"){
   const cat=filterInventoryCatalog.filter(x=>x.boat_name===boat).sort((a,b)=>(a.position||0)-(b.position||0));
   wrap.innerHTML=`<div style="overflow:auto"><table><thead><tr><th>Référence</th><th>Caractéristique</th><th>Emplacement</th><th>Quantité</th></tr></thead><tbody>${cat.map(i=>`<tr><td>${esc(i.reference)}</td><td>${esc(i.characteristic||"—")}</td><td>${esc(i.location||"—")}</td><td><input id="finvqty-${i.id}" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></td></tr>`).join("")}</tbody></table></div>`;
 }else{
   const cat=inventoryCatalog.filter(x=>x.boat_name===boat).sort((a,b)=>(a.position||0)-(b.position||0));
   wrap.innerHTML=`<div style="overflow:auto"><table><thead><tr><th>Référence</th><th>Système</th><th>Unité</th><th>Quantité</th></tr></thead><tbody>${cat.map(i=>`<tr><td>${esc(i.reference)}</td><td>${esc(i.system||"—")}</td><td>${esc(i.unit||"—")}</td><td><input id="invqty-${i.id}" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></td></tr>`).join("")}</tbody></table></div>`;
 }
}
function readInventoryRows(boat){
 return inventoryCatalog.filter(x=>x.boat_name===boat).sort((a,b)=>(a.position||0)-(b.position||0)).map(i=>{
   const el=document.getElementById(`invqty-${i.id}`),raw=el?.value.trim()??"";
   if(raw==="")return {catalog_id:i.id,reference:i.reference,system:i.system||"",unit:i.unit||"",quantity:null};
   const n=Number(raw.replace(",","."));
   return {catalog_id:i.id,reference:i.reference,system:i.system||"",unit:i.unit||"",quantity:Number.isFinite(n)&&n>=0?n:null}
 })
}
async function saveInventoryRecord(){
 const boat=document.getElementById("inventoryBoat")?.value||"",date=document.getElementById("inventoryDate")?.value||"",operator=document.getElementById("inventoryOperator")?.value.trim()||null;
 if(!boat||!date){alert("Bateau et date obligatoires.");return}
 const items=readInventoryRows(boat);if(items.some(x=>x.quantity===null)){if(!confirm("Certaines quantités sont vides. Enregistrer quand même ?"))return}
 const {error}=await client.from("oil_grease_inventory_records").insert({boat_name:boat,inventory_date:date,operator_name:operator,items});
 if(error){alert("Impossible d'enregistrer l'inventaire : "+error.message);return}
 await loadData();renderInventory();alert("✓ Inventaire enregistré.")
}
async function editInventoryRecord(id){
 const x=inventoryRecords.find(r=>r.id===id);if(!x)return;
 const cat=inventoryCatalog.filter(c=>c.boat_name===x.boat_name).sort((a,b)=>(a.position||0)-(b.position||0)),m=inventoryItemsMap(x);
 const date=prompt("Date de l'inventaire :",x.inventory_date||"");if(date===null)return;
 const operator=prompt("Nom de l'opérateur (laisser vide si non renseigné) :",x.operator_name||"");if(operator===null)return;
 const items=[];
 for(const i of cat){
   const v=prompt(`${i.reference} — ${i.unit||""}\nQuantité :`,m[i.id]===null||m[i.id]===undefined?"":String(m[i.id]));
   if(v===null)return;
   if(v.trim()===""){items.push({catalog_id:i.id,reference:i.reference,system:i.system||"",unit:i.unit||"",quantity:null});continue}
   const n=Number(v.replace(",","."));if(!Number.isFinite(n)||n<0){alert("Quantité invalide pour : "+i.reference);return}
   items.push({catalog_id:i.id,reference:i.reference,system:i.system||"",unit:i.unit||"",quantity:n})
 }
 const {error}=await client.from("oil_grease_inventory_records").update({inventory_date:date.trim(),operator_name:operator.trim()||null,items}).eq("id",id);
 if(error){alert("Impossible de modifier l'inventaire : "+error.message);return}
 await loadData();renderInventory();alert("✓ Inventaire modifié.")
}

const AUDIT_BOATS=["Paris Iéna","Paris Trocadéro","Paris Montmartre","Paris Montparnasse","Paris Etoile"];
const AUDIT_CATEGORY="cosmetique_technique";
let auditBoatFilter="",auditDateFilter="",editingAuditId=null,auditZones=[];
function auditCategoryLabel(){return "Cosmétique / Technique"}
function auditSpeech(id){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert("La saisie vocale n'est pas disponible sur ce navigateur. Vous pouvez utiliser le clavier.");return}
 const btn=document.getElementById("auditMic-"+id); const ta=document.getElementById("auditComment-"+id); if(!ta)return;
 const r=new SR(); r.lang="fr-FR"; r.interimResults=false; r.continuous=false;
 if(btn)btn.textContent="🎙️ Écoute…";
 r.onresult=e=>{const txt=e.results?.[0]?.[0]?.transcript||"";ta.value=(ta.value?ta.value.trim()+" ":"")+txt; const z=auditZones.find(v=>v.id===id);if(z)z.comment=ta.value};
 r.onerror=e=>{alert("La saisie vocale n'a pas pu être utilisée : "+(e.error||"erreur"))};
 r.onend=()=>{if(btn)btn.textContent="🎙️ Micro"};
 r.start();
}
function auditPhotoPreview(input,id){
 const files=[...(input.files||[])]; const out=document.getElementById("auditPhotoPreview-"+id);if(!out)return;
 out.innerHTML=files.map((f,i)=>{const url=URL.createObjectURL(f);return `<img src="${url}" style="max-width:140px;max-height:100px;border-radius:10px;object-fit:cover;margin:4px">`}).join("");
}
function normalizeAuditZones(x){
 if(Array.isArray(x?.zones)&&x.zones.length)return x.zones.map((z,i)=>({id:"z"+i,point:String(z.point||""),comment:String(z.comment||""),photo_urls:Array.isArray(z.photo_urls)?z.photo_urls.filter(Boolean):[]}));
 return [{id:"z0",point:String(x?.point||""),comment:String(x?.comment||""),photo_urls:x?.photo_url?[x.photo_url]:[]}];
}
function renderAuditZones(){
 const out=document.getElementById("auditZones");if(!out)return;
 out.innerHTML=auditZones.map((z,i)=>`<div class="item" style="margin-top:10px"><div class="row"><div class="grow"><b>Zone ${i+1}</b></div>${auditZones.length>1?`<button class="danger" onclick="removeAuditZone('${z.id}')">Supprimer</button>`:""}</div><label>Zone / point contrôlé(e)</label><input id="auditPoint-${z.id}" value="${esc(z.point)}" placeholder="Ex. Pont, salon, machine, timonerie…" oninput="updateAuditZone('${z.id}','point',this.value)"><label>Commentaire / constat</label><textarea id="auditComment-${z.id}" rows="4" placeholder="Saisir au clavier ou utiliser le micro" oninput="updateAuditZone('${z.id}','comment',this.value)">${esc(z.comment)}</textarea><button class="secondary" id="auditMic-${z.id}" onclick="auditSpeech('${z.id}')">🎙️ Micro</button><label style="margin-top:8px">Photo(s) de cette zone / ce commentaire (facultatif)</label><input id="auditPhoto-${z.id}" type="file" accept="image/*" capture="environment" multiple onchange="auditPhotoPreview(this,'${z.id}')"><div id="auditPhotoPreview-${z.id}" style="margin-top:8px">${(z.photo_urls||[]).map((u,j)=>`<span style="display:inline-block;margin:4px"><a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" style="max-width:140px;max-height:100px;border-radius:10px;object-fit:cover"></a><br><span class="small">Photo ${j+1}</span></span>`).join("")}</div></div>`).join("");
}
function updateAuditZone(id,key,value){const z=auditZones.find(v=>v.id===id);if(z)z[key]=value}
function addAuditZone(){auditZones.push({id:"z"+Date.now()+""+Math.random().toString(36).slice(2),point:"",comment:"",photo_urls:[]});renderAuditZones();document.getElementById("auditZones")?.lastElementChild?.scrollIntoView({behavior:"smooth",block:"center"})}
function removeAuditZone(id){auditZones=auditZones.filter(z=>z.id!==id);if(!auditZones.length)addAuditZone();else renderAuditZones()}
function renderAudits(){
 const filtered=auditRecords.filter(x=>(!auditBoatFilter||x.boat_name===auditBoatFilter)&&(!auditDateFilter||x.audit_date===auditDateFilter));
 const latest=AUDIT_BOATS.map(name=>{const x=auditRecords.find(r=>r.boat_name===name);return `<div class="card"><div class="row"><div class="grow"><h3 style="margin:0">⚓ ${esc(name)}</h3><div class="small">Dernier audit : ${x?esc(x.audit_date):"Aucun audit enregistré"}</div></div><button onclick="openAuditForm('${name}')">＋ Nouvel audit</button></div></div>`}).join("");
 const form=`<div class="card hidden" id="auditFormCard"><div class="row"><div class="grow"><h2 id="auditFormTitle" style="margin:0">🔎 Nouvel audit bateau</h2></div><button class="secondary" onclick="closeAuditForm()">Fermer</button></div><div class="levelgrid"><div><label>Bateau</label><select id="auditBoat">${AUDIT_BOATS.map(b=>`<option>${esc(b)}</option>`).join("")}</select></div><div><label>Date de visite</label><input id="auditDate" type="date" value="${isoDate(new Date())}"></div><div><label>Type de visite</label><input value="Cosmétique / Technique" disabled></div></div><div class="card" style="margin:12px 0 0;padding:12px;background:#f8fafc"><div class="row"><div class="grow"><h3 style="margin:0">Zones contrôlées</h3><div class="small">Ajoutez autant de zones que nécessaire. Chaque zone possède son propre commentaire, saisissable au clavier ou au micro.</div></div><button class="secondary" onclick="addAuditZone()">＋ Ajouter une zone</button></div><div id="auditZones"></div></div><div style="margin-top:12px"><button onclick="saveAudit()">✓ Enregistrer l'audit</button></div><p class="small">Un seul audit peut maintenant contenir plusieurs zones contrôlées et un commentaire pour chacune.</p></div>`;
 const history=`<div class="card"><div class="row"><div class="grow"><h2 style="margin:0">Historique des audits</h2><div class="small">${filtered.length} audit(s) affiché(s)</div></div><button class="secondary" onclick="exportAuditsPDF()">🖨️ Exporter / imprimer en PDF</button></div><div class="row" style="margin-top:10px"><div class="grow"><label>Bateau</label><select onchange="auditBoatFilter=this.value;renderAudits()"><option value="">Tous les bateaux</option>${AUDIT_BOATS.map(b=>`<option value="${esc(b)}" ${auditBoatFilter===b?"selected":""}>${esc(b)}</option>`).join("")}</select></div><div class="grow"><label>Date</label><input type="date" value="${esc(auditDateFilter)}" onchange="auditDateFilter=this.value;renderAudits()"></div><div style="align-self:end"><button class="secondary" onclick="auditBoatFilter='';auditDateFilter='';renderAudits()">Réinitialiser</button></div></div></div>`+
 (filtered.length?filtered.map(x=>{const zones=normalizeAuditZones(x);return `<div class="card"><div class="row"><div class="grow"><h3 style="margin:0">${esc(x.boat_name)} — ${auditCategoryLabel()}</h3><div class="small">📅 ${esc(x.audit_date)} · ${new Date(x.created_at).toLocaleString("fr-FR")}</div></div><span class="pill ${x.task_created?"ok":"warn"}">${x.task_created?"✓ Tâche créée":"À traiter"}</span></div><div>${zones.map((z,i)=>`<div class="item" style="margin-top:8px"><b>Zone ${i+1} — ${esc(z.point||"Non renseignée")}</b><p style="white-space:pre-wrap;margin-bottom:0">${esc(z.comment||"Aucun commentaire")}</p>${(z.photo_urls||[]).map((u,j)=>`<div style="margin-top:6px">📷 <a href="${esc(u)}" target="_blank" rel="noopener">Voir la photo ${j+1}</a></div>`).join("")}</div>`).join("")}</div><div class="row">${x.task_created?"":`<button onclick="scheduleAuditTask('${x.id}')">📅 Distribuer au planning</button>`}${profile?.role==="admin"?`<button class="secondary" onclick="editAudit('${x.id}')">✎ Modifier</button><button class="danger" onclick="deleteAudit('${x.id}')">🗑 Supprimer</button>`:""}</div></div>`}).join(""):`<div class="card"><p class="muted">Aucun audit correspondant aux filtres.</p></div>`);
 document.getElementById("page-audits").innerHTML=`<div class="card"><div class="row"><div class="grow"><h2 style="margin:0">🔎 Audit bateaux</h2><p class="muted">Visites régulières <b>Cosmétique / Technique</b> des 5 bateaux, avec plusieurs zones contrôlées, commentaire par zone et photo facultative.</p></div><button onclick="openAuditForm()">＋ Nouvel audit</button></div></div>`+latest+form+history;
}
function openAuditForm(boat){
 editingAuditId=null;auditZones=[{id:"z"+Date.now(),point:"",comment:"",photo_urls:[]}];
 document.getElementById("auditFormCard")?.classList.remove("hidden");
 document.getElementById("auditFormTitle").textContent="🔎 Nouvel audit bateau";
 if(boat&&document.getElementById("auditBoat"))document.getElementById("auditBoat").value=boat;
 renderAuditZones();document.getElementById("auditFormCard")?.scrollIntoView({behavior:"smooth",block:"start"});
}
function closeAuditForm(){document.getElementById("auditFormCard")?.classList.add("hidden");editingAuditId=null}
async function saveAudit(){
 const boat=document.getElementById("auditBoat")?.value||"",date=document.getElementById("auditDate")?.value||isoDate(new Date());
 const zones=auditZones.map(z=>({id:z.id,point:String(z.point||"").trim(),comment:String(z.comment||"").trim(),photo_urls:Array.isArray(z.photo_urls)?z.photo_urls.filter(Boolean):[]})).filter(z=>z.point||z.comment||z.photo_urls.length);
 if(!boat||!date||!zones.length||zones.some(z=>!z.point)){alert("Bateau, date et au moins une zone avec son nom sont obligatoires.");return}
 const tempId=crypto.randomUUID?crypto.randomUUID():String(Date.now());
 for(let i=0;i<zones.length;i++){
   const input=document.getElementById("auditPhoto-"+auditZones[i]?.id);
   const files=[...(input?.files||[])];
   for(let n=0;n<files.length;n++){
     const f=files[n],safe=(f.name||"photo.jpg").replace(/[^a-zA-Z0-9._-]/g,"_");
     const path=`audits/${date}/${tempId}_${i}_${n}_${safe}`;
     const up=await client.storage.from("audit-photos").upload(path,f,{upsert:false,contentType:f.type||"image/jpeg"});
     if(up.error){alert("Impossible d'enregistrer une photo : "+up.error.message);return}
     zones[i].photo_urls.push(client.storage.from("audit-photos").getPublicUrl(path).data.publicUrl);
   }
 }
 const legacyPhoto=zones[0]?.photo_urls?.[0]||null;
 const row={boat_name:boat,audit_date:date,category:AUDIT_CATEGORY,point:zones[0].point,comment:zones[0].comment,photo_url:legacyPhoto,zones:zones.map(({id,...z})=>z)};
 let result;
 if(editingAuditId) result=await client.from("boat_audits").update(row).eq("id",editingAuditId); else result=await client.from("boat_audits").insert({...row,created_by:profile?.id||null});
 if(result.error){alert("Impossible d'enregistrer l'audit : "+result.error.message);return}
 editingAuditId=null;await loadData();renderAudits();alert("✓ Audit enregistré.");
}
async function scheduleAuditTask(id){
 const x=auditRecords.find(r=>r.id===id);if(!x)return;
 const date=prompt("Date de la tâche à créer dans le planning :",x.audit_date);if(date===null||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date))return;
 const operator=prompt("Opérateur (facultatif) :","");if(operator===null)return;
 const zones=normalizeAuditZones(x);const detail=zones.map((z,i)=>`Zone ${i+1}: ${z.point}${z.comment?" — "+z.comment:""}`).join(" | ");
 const task=`Audit bateaux — ${detail}`;
 const {data,error}=await client.from("tasks").insert({task_date:date,boat_name:x.boat_name,operator_name:operator.trim()||null,task,status:"todo"}).select("id").single();
 if(error){alert("Impossible de créer la tâche : "+error.message);return}
 const up=await client.rpc("mark_boat_audit_task_created",{p_id:id});if(up.error){alert("La tâche a été créée mais le statut de l'audit n'a pas pu être mis à jour : "+up.error.message);return}
 await loadData();renderAudits();alert("✓ Tâche ajoutée au planning.");
}

 if(!filtered.length){alert("Aucun audit à exporter avec les filtres actuels.");return}
 const title=`Audit bateaux${auditBoatFilter?" — "+auditBoatFilter:""}`;const w=window.open("","_blank");if(!w){alert("Le navigateur a bloqué la fenêtre d'impression. Autorisez les fenêtres pop-up pour cette application.");return}
 w.document.write(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Arial,sans-serif;margin:28px;color:#111}h1{font-size:22px}h2{font-size:17px;margin-bottom:4px}.meta{color:#555;font-size:12px}.audit{border:1px solid #bbb;border-radius:8px;padding:12px;margin:12px 0;break-inside:avoid}.zone{border-top:1px solid #ddd;padding-top:7px;margin-top:7px}.audit img{max-width:260px;max-height:190px;margin-top:8px;border-radius:6px}.comment{white-space:pre-wrap}@media print{button{display:none}}</style></head><body><h1>🔎 AUDIT BATEAUX</h1><div class="meta">Édition du ${new Date().toLocaleString("fr-FR")} · ${filtered.length} audit(s)</div>${filtered.map(x=>`<div class="audit"><h2>${esc(x.boat_name)} — Cosmétique / Technique</h2><div class="meta">Date : ${esc(x.audit_date)} · ${x.task_created?"Tâche planning créée":"Sans tâche planning"}</div>${normalizeAuditZones(x).map((z,i)=>`<div class="zone"><b>Zone ${i+1} : ${esc(z.point||"Non renseignée")}</b><div class="comment"><b>Commentaire :</b> ${esc(z.comment||"Aucun commentaire")}</div>${(z.photo_urls||[]).map(u=>`<img src="${esc(u)}">`).join("")}</div>`).join("")}</div>`).join("")}<script>window.onload=()=>setTimeout(()=>window.print(),400)<\/script></body></html>`);w.document.close();
}
function renderChecklist(){
 const b=currentBoat;
 const tech=checklistTechName||"";
 const date=checklistDate||isoDate(new Date());
 document.getElementById("page-checklist").innerHTML=`<div class="card"><div class="row"><button class="secondary" onclick="showPage('home')">← Retour</button><div class="grow"><h2 style="margin:0">🔧 Technique — ${esc(b.name)}</h2></div></div><p class="small">Renseignez les points ci-dessous. Le nom du technicien et la date sont conservés pendant toute la checklist.</p></div>`+
 currentItems.map((it,n)=>{let a=answers[it.id]||{};return `<div class="item"><div class="item-title">${n+1}. ${esc(it.title)}</div><div class="choices"><button class="${a.status==="ok"?"sel-ok":""}" onclick="answer('${it.id}','ok')">✓ Conforme</button><button class="${a.status==="anomaly"?"sel-anom":""}" onclick="answer('${it.id}','anomaly')">⚠ Anomalie</button><button class="${a.status==="na"?"sel-na":""}" onclick="answer('${it.id}','na')">— N/A</button></div>${a.status==="anomaly"?`<div class="anomaly"><label>Description obligatoire</label><textarea id="desc-${it.id}" oninput="answers['${it.id}'].desc=this.value" placeholder="Décrire l'anomalie">${esc(a.desc||"")}</textarea>${levelInputs(it,a)}<label>Photo(s)</label><input type="file" accept="image/*" capture="environment" multiple onchange="addPhotos('${it.id}',this.files)"><div class="photos">${(a.photos||[]).map(p=>`<img src="${p}">`).join("")}</div></div>`:""}</div>`}).join("")+
 `<div class="card"><h3 style="margin-top:0">👤 Informations de la checklist</h3><label>Nom du technicien</label><input id="techName" value="${esc(tech)}" placeholder="Nom et prénom" oninput="checklistTechName=this.value"><label>Date</label><input id="techDate" type="date" value="${esc(date)}" onchange="checklistDate=this.value"><label>💬 Commentaire <span class="small">(facultatif)</span></label><textarea id="checklistGeneralComment" rows="4" placeholder="Ajouter un commentaire (facultatif)" oninput="checklistGeneralComment=this.value">${esc(checklistGeneralComment||"")}</textarea><div style="margin-top:12px"><button style="width:100%" onclick="validateChecklist()">✓ Valider et préparer l'e-mail</button></div><p class="small">Après validation, vous revenez sur la liste des checklists.</p></div>`;
}

function answer(id,status){answers[id]=answers[id]||{};answers[id].status=status;renderChecklist()}
function setLevelQty(id,key,value){answers[id]=answers[id]||{};answers[id].levels=answers[id].levels||{};answers[id].levels[key]=value}
function addPhotos(id,files){answers[id]=answers[id]||{};answers[id].photos=answers[id].photos||[];answers[id].photoFiles=answers[id].photoFiles||[];[...files].forEach(f=>{answers[id].photoFiles.push(f);let r=new FileReader();r.onload=()=>{answers[id].photos.push(r.result);renderChecklist()};r.readAsDataURL(f)})}
async function validateChecklist(){
 const tech=(document.getElementById("techName")?.value||checklistTechName||"").trim();
 const date=document.getElementById("techDate")?.value||checklistDate||"";
 checklistTechName=tech; checklistDate=date; checklistGeneralComment=document.getElementById("checklistGeneralComment")?.value||checklistGeneralComment;
 if(!tech||!date){alert("Nom du technicien et date obligatoires.");return}
 const missing=currentItems.filter(i=>!answers[i.id]?.status);
 if(missing.length){alert("Tous les points doivent être renseignés.");return}
 const bad=currentItems.filter(i=>answers[i.id].status==="anomaly"&&!String(answers[i.id].desc||"").trim());
 if(bad.length){alert("Une description est obligatoire pour chaque anomalie.");return}
 const anomalies=currentItems.filter(i=>answers[i.id].status==="anomaly");
 const button=document.querySelector('#page-checklist button[onclick="validateChecklist()"]');
 if(button){button.disabled=true;button.textContent='⏳ Validation en cours…'}
 try {
  await saveChecklistLevels(tech,date);
  const photoLinks=[];
  for(const it of anomalies){
   const files=answers[it.id].photoFiles||[];
   for(let n=0;n<files.length;n++){
    const f=files[n],safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const path=`checklists/${currentBoat.name.replace(/[^a-zA-Z0-9_-]/g,"_")}/${date}/${Date.now()}_${it.id}_${n}_${safe}`;
    const up=await client.storage.from("checklist-photos").upload(path,f,{upsert:false,contentType:f.type||"image/jpeg"});
    if(up.error)throw new Error("Upload photo : "+up.error.message);
    const pub=client.storage.from("checklist-photos").getPublicUrl(path);photoLinks.push({title:it.title,url:pub.data.publicUrl});
   }
  }
  let body=`CHECK VDP — CHECKLIST TECHNIQUE\n\nBateau : ${currentBoat.name}\nDate : ${date}\nTechnicien : ${tech}\n\n`;
  if(!anomalies.length)body+="AUCUNE ANOMALIE CONSTATÉE.\n";else{body+="ANOMALIES :\n";anomalies.forEach((it,i)=>body+=`${i+1}. ${it.title}
   ${answers[it.id].desc}\n`)}
  if(photoLinks.length){body+="\nPHOTOS :\n";photoLinks.forEach((x,i)=>body+=`${i+1}. ${x.title} — ${x.url}\n`)}else body+="\nAucune photo jointe.\n";
  if(checklistGeneralComment.trim())body+=`\nCOMMENTAIRE GÉNÉRAL :\n${checklistGeneralComment.trim()}\n`;
  const submission={boat_name:currentBoat.name,checklist_date:date,operator_name:tech,result:{items:currentItems.map(it=>({id:it.id,title:it.title,status:answers[it.id]?.status||null,description:answers[it.id]?.desc||'',level_quantities:answers[it.id]?.levels||{}})),photo_links:photoLinks.map(x=>({title:x.title,url:x.url})),general_comment:checklistGeneralComment.trim()}};
  const saved=await client.from('checklist_submissions').insert(submission);
  if(saved.error)throw new Error('Enregistrement de la checklist : '+saved.error.message);

  // Une checklist sans anomalie et sans commentaire est uniquement enregistrée : aucun e-mail n’est préparé.
  const shouldSendMail = anomalies.length > 0 || checklistGeneralComment.trim().length > 0;
  if(!shouldSendMail){
   alert('✓ Checklist conforme enregistrée. Aucun e-mail n’a été préparé.');
   currentBoat=null; currentItems=[]; answers={}; photos={}; checklistTechName=""; checklistDate=""; checklistGeneralComment="";
   renderHome();
   showPage("home");
   return;
  }

  // En présence d’une anomalie ou d’un commentaire, la checklist est enregistrée puis l’e-mail est préparé.
  const subject=encodeURIComponent(`CHECK VDP — ${currentBoat.name} — ${date}`);
  const mailto=`mailto:${VDP_CONFIG.alertEmail}?subject=${subject}&body=${encodeURIComponent(body)}`;
  alert(anomalies.length ? '✓ Checklist enregistrée avec anomalie. L’e-mail va s’ouvrir.' : '✓ Checklist enregistrée avec commentaire. L’e-mail va s’ouvrir.');
  currentBoat=null; currentItems=[]; answers={}; photos={}; checklistTechName=""; checklistDate=""; checklistGeneralComment="";
  renderHome();
  showPage("home");
  location.href=mailto;
 } catch(e) {
  alert('La validation a échoué : '+e.message);
  if(button){button.disabled=false;button.textContent="✓ Valider et préparer l'e-mail"}
 }
}

function renderChecklistHistory(){
 const boatFilter=document.getElementById("historyBoat")?.value||"";
 const dateFilter=document.getElementById("historyDate")?.value||"";
 const list=checklistSubmissions.filter(s=>(!boatFilter||s.boat_name===boatFilter)&&(!dateFilter||s.checklist_date===dateFilter));
 const boatsForFilter=boats.filter(b=>["Paris Iéna","Paris Trocadéro","Paris Montmartre","Paris Montparnasse","Paris Etoile"].includes(b.name));
 document.getElementById("page-history").innerHTML=`<div class="card"><h2>📋 Checklists enregistrées</h2><p class="muted">Consultez les checklists validées par date et par bateau.</p><div class="row"><div class="grow"><label>Bateau</label><select id="historyBoat" onchange="renderChecklistHistory()"><option value="">Tous les bateaux</option>${boatsForFilter.map(b=>`<option value="${esc(b.name)}" ${boatFilter===b.name?"selected":""}>${esc(b.name)}</option>`).join("")}</select></div><div class="grow"><label>Date</label><input id="historyDate" type="date" value="${esc(dateFilter)}" onchange="renderChecklistHistory()"></div><div style="align-self:end"><button class="secondary" onclick="clearChecklistHistoryFilters()">Réinitialiser</button></div></div></div>`+
 (list.length?list.map(s=>{const r=s.result||{}, its=Array.isArray(r.items)?r.items:[], anomalies=its.filter(i=>i.status==="anomaly");return `<div class="card"><div class="row"><div class="grow"><h3 style="margin:0">⚓ ${esc(s.boat_name)}</h3><div class="small">📅 ${esc(s.checklist_date)} · 👤 ${esc(s.operator_name)}</div></div><span class="pill ok">✓ Enregistrée</span></div><div class="small" style="margin-top:8px">${its.length} point(s) · ${anomalies.length} anomalie(s) · Enregistrée le ${new Date(s.created_at).toLocaleString("fr-FR")}</div><div class="row" style="margin-top:10px"><button onclick="viewChecklistSubmission('${s.id}')">👁 Voir la checklist</button>${profile?.role==="admin"?`<button class="danger" onclick="deleteChecklistSubmission('${s.id}')">🗑 Supprimer</button>`:""}</div></div>`}).join(""):`<div class="card"><p class="muted">Aucune checklist enregistrée pour ces critères.</p></div>`);
}
function clearChecklistHistoryFilters(){renderChecklistHistory()}
async function deleteChecklistSubmission(id){
 if(profile?.role!=="admin"){alert("Seul un administrateur peut supprimer une checklist enregistrée.");return}
 const s=checklistSubmissions.find(x=>x.id===id); if(!s)return;
 if(!confirm(`Supprimer définitivement la checklist du ${s.checklist_date} — ${s.boat_name} ?`))return;
 const {error}=await client.from("checklist_submissions").delete().eq("id",id);
 if(error){alert("Suppression impossible : "+error.message);return}
 checklistSubmissions=checklistSubmissions.filter(x=>x.id!==id);
 renderChecklistHistory();
}
function viewChecklistSubmission(id){
 const s=checklistSubmissions.find(x=>x.id===id); if(!s)return;
 const r=s.result||{},its=Array.isArray(r.items)?r.items:[],photos=Array.isArray(r.photo_links)?r.photo_links:[];
 document.getElementById("page-history").innerHTML=`<div class="card"><div class="row"><button class="secondary" onclick="renderChecklistHistory()">← Retour à l'historique</button><div class="grow"><h2 style="margin:0">📋 Checklist — ${esc(s.boat_name)}</h2></div></div><p><b>Date :</b> ${esc(s.checklist_date)}<br><b>Technicien :</b> ${esc(s.operator_name)}<br><b>Enregistrée le :</b> ${new Date(s.created_at).toLocaleString("fr-FR")}</p></div>`+
 `<div class="card"><h3>Résultats</h3>${its.map((it,n)=>`<div class="item"><div class="row"><div class="grow"><b>${n+1}. ${esc(it.title)}</b>${it.description?`<div class="small" style="margin-top:5px">${esc(it.description)}</div>`:""}</div><span class="pill ${it.status==="ok"?"ok":it.status==="anomaly"?"warn":""}">${it.status==="ok"?"✓ Conforme":it.status==="anomaly"?"⚠ Anomalie":"— N/A"}</span></div>${it.level_quantities&&Object.keys(it.level_quantities).some(k=>it.level_quantities[k])?`<div class="small" style="margin-top:5px">🛢️ ${Object.entries(it.level_quantities).filter(([k,v])=>v).map(([k,v])=>`${esc(k)} : ${esc(v)} L`).join(" · ")}</div>`:""}</div>`).join("")}</div>`+
 (r.general_comment?`<div class="card"><h3>💬 Commentaire</h3><p style="white-space:pre-wrap">${esc(r.general_comment)}</p></div>`:"")+(photos.length?`<div class="card"><h3>📷 Photos</h3>${photos.map((x,i)=>`<div style="margin:7px 0"><a href="${esc(x.url)}" target="_blank" rel="noopener">Voir la photo ${i+1} — ${esc(x.title||"")}</a></div>`).join("")}</div>`:"");
 showPage("history");
}

function renderAdmin(){
 if(profile?.role!=="admin")return;
 document.getElementById("page-admin").innerHTML=`<div class="card"><h2>⚙️ Administration</h2><p class="muted">Les modifications sont enregistrées dans la base partagée et deviennent disponibles sur les autres appareils.</p></div>`+
 boats.map(b=>`<div class="card"><div class="row"><div class="grow"><h3>⚓ ${esc(b.name)}</h3></div><button onclick="adminAdd('${b.id}')">＋ Ajouter un point</button></div><div id="adm-${b.id}">${items.filter(i=>i.boat_id===b.id).map((it,n)=>`<div class="item"><div class="row"><div class="grow"><b>${n+1}. ${esc(it.title)}</b></div><button class="secondary" onclick="adminEdit('${it.id}')">Modifier</button><button class="secondary" onclick="adminMove('${it.id}',-1)">↑</button><button class="secondary" onclick="adminMove('${it.id}',1)">↓</button><button class="danger" onclick="adminDelete('${it.id}')">Supprimer</button></div></div>`).join("")}</div></div>`).join("");
}
async function adminAdd(boatId){let title=prompt("Nouveau point technique :");if(!title)return;let max=Math.max(0,...items.filter(i=>i.boat_id===boatId).map(i=>i.position));let r=await client.from("checklist_items").insert({boat_id:boatId,title,position:max+1,active:true});if(r.error)alert(r.error.message);else{await refresh();renderAdmin()}}
async function adminEdit(id){let it=items.find(x=>x.id===id);let title=prompt("Modifier le point :",it.title);if(!title)return;let r=await client.from("checklist_items").update({title}).eq("id",id);if(r.error)alert(r.error.message);else{await refresh();renderAdmin()}}
async function adminDelete(id){if(!confirm("Supprimer ce point ?"))return;let r=await client.from("checklist_items").update({active:false}).eq("id",id);if(r.error)alert(r.error.message);else{await refresh();renderAdmin()}}
async function adminMove(id,dir){
 let list=items.filter(i=>i.boat_id===items.find(x=>x.id===id).boat_id).sort((a,b)=>a.position-b.position),idx=list.findIndex(x=>x.id===id),j=idx+dir;if(j<0||j>=list.length)return;
 let a=list[idx],b=list[j];await client.from("checklist_items").update({position:b.position}).eq("id",a.id);await client.from("checklist_items").update({position:a.position}).eq("id",b.id);await refresh();renderAdmin()
}
async function refresh(){await loadData();renderHome();renderAdmin();renderChecklistHistory();if(!document.getElementById("page-levels").classList.contains("hidden"))renderLevels();if(!document.getElementById("page-temperatures").classList.contains("hidden"))renderTemperatures();if(!document.getElementById("page-inventory").classList.contains("hidden"))renderInventory();if(!document.getElementById("page-audits").classList.contains("hidden"))renderAudits()}
document.querySelectorAll("nav button[data-page]").forEach(b=>b.onclick=()=>{showPage(b.dataset.page);if(b.dataset.page==="calendar")renderCalendar();if(b.dataset.page==="history")renderChecklistHistory();if(b.dataset.page==="temperatures")renderTemperatures();if(b.dataset.page==="inventory")renderInventory();if(b.dataset.page==="audits")renderAudits();if(b.dataset.page==="admin")renderAdmin()});
document.getElementById("loginBtn").onclick=async()=>{let e=loginEmail.value.trim(),p=loginPassword.value;setMsg("loginMsg","Connexion…");let r=await client.auth.signInWithPassword({email:e,password:p});if(r.error)setMsg("loginMsg",r.error.message,true);else startApp()};
document.getElementById("logoutBtn").onclick=async()=>{await client.auth.signOut();location.reload()};
async function startApp(){document.getElementById("loginView").classList.add("hidden");document.getElementById("appView").classList.remove("hidden");try{await loadProfile();await loadData();renderHome();renderCalendar();renderLevels();renderTemperatures();renderInventory();renderChecklistHistory();renderAudits();if(profile.role==="admin")renderAdmin()}catch(e){alert("Erreur de chargement : "+e.message)}}
client.auth.onAuthStateChange((_event,session)=>{if(session&&!profile)startApp()});
(async()=>{const {data:{session}}=await client.auth.getSession();if(session)startApp()})();
</script>
