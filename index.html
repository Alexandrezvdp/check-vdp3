<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d5c"><link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CHECK VDP">
<title>CHECK VDP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial;background:#f3f6f8;color:#17212b}
header{background:#0b3d5c;color:#fff;padding:20px}header h1{margin:0}header p{margin:5px 0 0}
main{max-width:950px;margin:auto;padding:15px}.card,.panel,.item{background:#fff;border:1px solid #d9e2e8;border-radius:14px;padding:15px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}h2{margin-top:0}
button{border:0;border-radius:10px;padding:11px 13px;font-weight:700;font-size:14px;cursor:pointer}
.primary{background:#0b3d5c;color:white}.secondary{background:#e9f1f5;color:#0b3d5c}.choice{background:#edf3f6;margin:4px 3px 0 0}
.selected-ok{background:#dff4e8;color:#147a4b}.selected-bad{background:#fde4e1;color:#b42318}.selected-na{background:#e5e5ea;color:#555}
.hidden{display:none}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea{width:100%;padding:10px;border:1px solid #ccd7de;border-radius:9px;margin-top:5px;font:inherit}
.warn{padding:12px;background:#fff4e5;border-radius:10px;margin:12px 0}.ok{padding:12px;background:#e8f7ee;border-radius:10px;margin:12px 0}
.small{font-size:12px;color:#64748b}@media(max-width:600px){.meta{grid-template-columns:1fr}}
</style></head><body>
<header><h1>CHECK VDP</h1><p>Contrôle quotidien — Technique</p></header><main>
<section id="home"><div class="panel"><h2>Sélectionner un bateau</h2><p class="small">Aucun résultat n'est enregistré sur un serveur.</p></div><div id="boats" class="grid"></div></section>
<section id="check" class="hidden"><button class="secondary" onclick="home()">← Accueil</button>
<div class="panel"><h2 id="title"></h2><div class="meta">
<label>Nom du technicien<input id="tech" placeholder="Nom et prénom"></label>
<label>Date<input id="date" type="date"></label></div>
<div id="items"></div><div id="result"></div>
<button class="primary" onclick="validate()">Valider la checklist</button>
<button id="mail" class="primary hidden" onclick="mail()">✉️ Envoyer l'alerte e-mail</button>
<p class="small">L'alerte ouvre votre application e-mail avec un message prérempli vers a.zinzius@vedettesdeparis.com. Vous devez appuyer sur Envoyer.</p></div></section>
</main><script>
const EMAIL="a.zinzius@vedettesdeparis.com",boats={"Paris Iéna": ["Vérification de l'ensemble des locaux (fuite, eau dans les fonds, bruits anormaux,...)", "Vérification niveau liquide de refroidissement moteurs", "Vérification niveau huile appareil à gouverner", "Vérification niveau huile étambot lignes d'arbres", "Démarrage pack batteries Bâbord et Tribord", "Essais appareil à gouverner normal et secours", "Démarrage moteurs + test Embrayage Av/Ar", "Vérification fonctionnement pompes de réfrigération moteur quand les moteurs sont en service", "Essais : Feux de navigation, GPS, VHF, Interphonie, Propulseur d'étrave, Micro/Sono, commande de l'appareil à gouverner normal et secours", "Vérification AIS", "Essai bascule distribution électrique AFE", "Créer nouvelle croisière sur l'onglet journal de bord de BoatOn"], "Paris Trocadéro": ["Vérification de l'ensemble des locaux (fuite, eau dans les fonds, bruits anormaux,...)", "Vérification niveau liquide de refroidissement moteurs", "Vérification niveau huile appareil à gouverner", "Vérification niveau huile étambot lignes d'arbres", "Démarrage pack batteries Bâbord et Tribord", "Essais appareil à gouverner normal et secours", "Démarrage moteurs + test Embrayage Av/Ar", "Vérification fonctionnement pompes de réfrigération moteur quand les moteurs sont en service", "Essais : Feux de navigation, GPS, VHF, Interphonie, Propulseur d'étrave, Micro/Sono, commande de l'appareil à gouverner normal et secours", "Vérification AIS", "Essai bascule distribution électrique AFE", "Créer nouvelle croisière sur l'onglet journal de bord de BoatOn"], "Paris Montmartre": ["Vérification de l'ensemble des locaux (fuite, eau dans les fonds, bruits anormaux,...)", "Vérification niveau liquide de refroidissement moteurs", "Vérification niveau huile appareil à gouverner", "Vérification niveau huile étambot lignes d'arbres", "Démarrage pack batteries Bâbord et Tribord", "Essais appareil à gouverner normal et secours", "Démarrage moteurs + test Embrayage Av/Ar", "Vérification fonctionnement pompes de réfrigération moteur quand les moteurs sont en service", "Essais : Feux de navigation, GPS, VHF, Interphonie, Propulseur d'étrave, Micro/Sono, commande de l'appareil à gouverner normal et secours", "Vérification AIS", "Essai bascule distribution électrique AFE", "Créer nouvelle croisière sur l'onglet journal de bord de BoatOn"], "Paris Montparnasse": ["Vérification de l'ensemble des locaux (fuite, eau dans les fonds, bruits anormaux,...)", "Vérification niveau liquide de refroidissement moteurs", "Vérification niveau huile appareil à gouverner", "Vérification niveau huile étambot lignes d'arbres", "Démarrage pack batteries Bâbord et Tribord", "Essais appareil à gouverner normal et secours", "Démarrage moteurs + test Embrayage Av/Ar", "Vérification fonctionnement pompes de réfrigération moteur quand les moteurs sont en service", "Essais : Feux de navigation, GPS, VHF, Interphonie, Propulseur d'étrave, Micro/Sono, commande de l'appareil à gouverner normal et secours", "Vérification AIS", "Essai bascule distribution électrique AFE", "Créer nouvelle croisière sur l'onglet journal de bord de BoatOn"], "Paris Etoile": ["Vérification de l'ensemble des locaux", "Vérification niveau liquide de refroidissement ligne d'arbre", "Vérification niveau huile appareil à gouverner", "Nettoyage des filtres eau brut", "Vérification niveau huile + liquide de refroidissement GENSET 1 et 2", "Vérification tension batteries", "Démarrage GENSET 1 et 2", "Démarrage moteurs + test Embrayage Av/Ar", "Vérification pression huile GENSET 1 et 2", "Vérification circulation eaux de réfrigération échappement", "Essais : Feux de navigation, GPS, VHF, Interphonie, Propulseur d'étrave, Micro/Sono, commande de l'appareil à gouverner normal et secours", "Vérification AIS", "Vérification ventilateurs variateur moteur", "Alimentations 24 V"]};let boat="",s=[];
const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function home(){check.classList.add("hidden");document.getElementById("home").classList.remove("hidden")}
function openBoat(b){boat=b;s=boats[b].map(()=>({v:null,n:""}));home();document.getElementById("home").classList.add("hidden");check.classList.remove("hidden");title.textContent="🔧 Checklist technique — "+b;tech.value="";date.value=new Date().toISOString().slice(0,10);mailBtn(false);render()}
function render(){items.innerHTML=boats[boat].map((x,i)=>`<div class="item"><b>${i+1}. ${esc(x)}</b><div>
<button class="choice ${s[i].v==='ok'?'selected-ok':''}" onclick="setv(${i},'ok')">✓ Conforme</button>
<button class="choice ${s[i].v==='bad'?'selected-bad':''}" onclick="setv(${i},'bad')">⚠ Anomalie</button>
<button class="choice ${s[i].v==='na'?'selected-na':''}" onclick="setv(${i},'na')">— N/A</button></div>
${s[i].v==='bad'?`<textarea rows="3" placeholder="Décrire l'anomalie" oninput="s[${i}].n=this.value">${esc(s[i].n)}</textarea>`:""}</div>`).join("")}
function setv(i,v){s[i].v=v;render()}
function mailBtn(show){document.getElementById("mail").classList.toggle("hidden",!show)}
function validate(){let missing=s.filter(x=>!x.v).length,bad=s.filter(x=>x.v==='bad');if(missing){result.innerHTML=`<div class="warn">⚠️ ${missing} point(s) non renseigné(s).</div>`;mailBtn(false);return}if(bad.some(x=>!x.n.trim())){result.innerHTML='<div class="warn">⚠️ Décris chaque anomalie avant l’envoi.</div>';mailBtn(false);return}if(bad.length){result.innerHTML=`<div class="warn">⚠️ Checklist validée avec ${bad.length} anomalie(s).</div>`;mailBtn(true)}else{result.innerHTML='<div class="ok">✓ Checklist validée : aucune anomalie.</div>';mailBtn(false)}}
function mail(){let d=date.value,t=tech.value.trim()||"Non renseigné",a=s.map((x,i)=>x.v==='bad'?`${i+1}. ${boats[boat][i]}\nAnomalie : ${x.n.trim()}`:null).filter(Boolean);let sub=`ALERTE CHECK VDP — ${boat} — ${d}`;let body=`Bonjour,\n\nAnomalie(s) constatée(s) lors de la checklist technique.\n\nBateau : ${boat}\nDate : ${d}\nTechnicien : ${t}\n\nANOMALIES :\n${a.join("\n\n")}\n\nCHECK VDP`;location.href=`mailto:${EMAIL}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`}
const check=document.getElementById("check"),title=document.getElementById("title"),items=document.getElementById("items"),result=document.getElementById("result"),tech=document.getElementById("tech"),date=document.getElementById("date");
const boatsEl=document.getElementById("boats");Object.keys(boats).forEach(b=>boatsEl.insertAdjacentHTML("beforeend",`<div class="card"><h2>⚓ ${esc(b)}</h2><button class="primary" onclick="openBoat('${b.replaceAll("'","\\'")}')">🔧 Technique</button><button class="secondary" disabled>☀️ Matin</button><button class="secondary" disabled>🌙 Soir</button><p class="small">Matin / Soir : à venir</p></div>`));
</script></body></html>
